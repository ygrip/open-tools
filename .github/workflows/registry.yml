name: Verify registry and bundles

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tool-registry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Empty repository variables must not turn the actual production deploy into a noindex preview.
      PUBLIC_SITE_URL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && (vars.PUBLIC_SITE_URL || 'https://tools.readynaz.com') || '' }}
      SEO_EXPECT_PRODUCTION: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Sync already verifies pinned manifest access, contract and every digest.
      # Skip the former duplicate access probe; a failed source still blocks the build.
      - name: Fetch and verify approved bundles
        env:
          TOOLS_GITHUB_TOKEN: ${{ secrets.TOOLS_GITHUB_TOKEN }}
          TOOLS_PARTNER_TOKEN: ${{ secrets.TOOLS_PARTNER_TOKEN }}
          TOOLS_APP_ID: ${{ secrets.TOOLS_APP_ID }}
          TOOLS_APP_PRIVATE_KEY: ${{ secrets.TOOLS_APP_PRIVATE_KEY }}
        run: npm run registry:sync
      - run: npm test && npm run check
      - name: Build static aggregator
        env:
          TOOLS_GITHUB_TOKEN: ${{ secrets.TOOLS_GITHUB_TOKEN }}
          TOOLS_PARTNER_TOKEN: ${{ secrets.TOOLS_PARTNER_TOKEN }}
          TOOLS_APP_ID: ${{ secrets.TOOLS_APP_ID }}
          TOOLS_APP_PRIVATE_KEY: ${{ secrets.TOOLS_APP_PRIVATE_KEY }}
        run: npm run build:verified
      - run: npm run performance:check
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser compatibility and mobile Web Vitals
        run: npm run test:e2e
      # PRs use noindex preview settings above. Compile again with the exact
      # production SEO profile to catch release-only byte changes before merge.
      # The deploy job only consumes the main-branch build, never this PR build.
      - name: Verify production build and size before merging
        if: github.event_name == 'pull_request'
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://tools.readynaz.com' }}
          SEO_EXPECT_PRODUCTION: 'true'
        run: |
          npm run build:verified
          npm run performance:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-web-vitals
          path: artifacts/mobile-vitals.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: trick-it-site
          include-hidden-files: true
          path: |
            build/
            worker/
            .wrangler.services.json

  deploy:
    # Deploy the exact build verified above, only for pushes to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: trick-it-site
          path: .
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config .wrangler.services.json
      - name: Verify public sitemap and robots after deploy
        run: |
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --retry-all-errors https://tools.readynaz.com/sitemap.xml -o /tmp/trick-it-sitemap.xml
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --retry-all-errors https://tools.readynaz.com/robots.txt -o /tmp/trick-it-robots.txt
          grep -Fq '<loc>https://tools.readynaz.com/</loc>' /tmp/trick-it-sitemap.xml
          grep -Fq '<loc>https://tools.readynaz.com/id/</loc>' /tmp/trick-it-sitemap.xml
          grep -Fq 'Sitemap: https://tools.readynaz.com/sitemap.xml' /tmp/trick-it-robots.txt
          grep -Fq 'Allow: /' /tmp/trick-it-robots.txt
