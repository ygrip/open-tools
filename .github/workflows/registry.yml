name: Verify registry and bundles

on:
  workflow_dispatch:
  push:
  pull_request:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: tool-registry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci && npm test && npm run build
        working-directory: examples/json-tools
      - name: Fetch approved bundles
        env:
          TOOLS_GITHUB_TOKEN: ${{ secrets.TOOLS_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run registry:sync
      - run: npm test && npm run check
      - name: Build static aggregator
        env:
          TOOLS_GITHUB_TOKEN: ${{ secrets.TOOLS_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build
      - name: Debug failed localized prerender
        if: failure()
        run: |
          find .svelte-kit/output/prerendered -maxdepth 5 -type f 2>/dev/null | head -35 || true
          node --input-type=module <<'JS'
          import { readdir, readFile } from 'node:fs/promises';
          import { join } from 'node:path';
          async function inspect(dir) {
            let names;
            try { names = await readdir(dir, { withFileTypes: true }); } catch { return; }
            for (const entry of names) {
              const p = join(dir, entry.name);
              if (entry.isDirectory()) await inspect(p);
              else if (entry.name.endsWith('.html') && /(?:id|index)/.test(p)) {
                const html = await readFile(p, 'utf8');
                console.log('HTML FILE:', p);
                for (const hit of html.matchAll(/(?:href|src)=["']([^"']+)["']/g)) {
                  const value = hit[1];
                  if (/\/d\/|\/id\/|sveltekit-prerender|\.\.http/.test(value)) console.log('LINK', value);
                }
              }
            }
          }
          await inspect('.svelte-kit/output/prerendered');
          JS
      - run: npm run performance:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: open-tools-site
          path: build/
