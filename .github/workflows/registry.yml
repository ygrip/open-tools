name: Verify registry and bundles

on:
  workflow_dispatch:
  push:
    branches: [main, 'feat/qr-camera-image-broker']
  pull_request:

permissions:
  contents: read

concurrency:
  group: tool-registry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify private tool repository access
        env:
          TOOLS_GITHUB_TOKEN: ${{ secrets.TOOLS_GITHUB_TOKEN }}
          TOOLS_PARTNER_TOKEN: ${{ secrets.TOOLS_PARTNER_TOKEN }}
          TOOLS_APP_ID: ${{ secrets.TOOLS_APP_ID }}
          TOOLS_APP_PRIVATE_KEY: ${{ secrets.TOOLS_APP_PRIVATE_KEY }}
        run: node scripts/registry-preflight.mjs
      - run: npm ci
      - name: Fetch approved bundles
        env:
          TOOLS_GITHUB_TOKEN: ${{ secrets.TOOLS_GITHUB_TOKEN }}
          TOOLS_PARTNER_TOKEN: ${{ secrets.TOOLS_PARTNER_TOKEN }}
          TOOLS_APP_ID: ${{ secrets.TOOLS_APP_ID }}
          TOOLS_APP_PRIVATE_KEY: ${{ secrets.TOOLS_APP_PRIVATE_KEY }}
        run: npm run registry:sync
      - run: npm test && npm run check
      - name: Build static aggregator
        env:
          TOOLS_GITHUB_TOKEN: ${{ secrets.TOOLS_GITHUB_TOKEN }}
          TOOLS_PARTNER_TOKEN: ${{ secrets.TOOLS_PARTNER_TOKEN }}
          TOOLS_APP_ID: ${{ secrets.TOOLS_APP_ID }}
          TOOLS_APP_PRIVATE_KEY: ${{ secrets.TOOLS_APP_PRIVATE_KEY }}
        run: npm run build
      - run: npm run performance:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: trick-it-site
          include-hidden-files: true
          path: |
            build/
            worker/
            .wrangler.services.json

  deploy:
    # Deploy the exact build verified above, only for pushes to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: trick-it-site
          path: .
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config .wrangler.services.json
