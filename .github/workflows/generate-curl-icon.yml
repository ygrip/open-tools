name: Generate cURL Studio icon assets
on:
  push:
    branches:
      - feat/register-curl-generator
    paths:
      - .github/workflows/generate-curl-icon.yml
permissions:
  contents: write
jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install image tools
        run: python -m pip install Pillow==11.3.0
      - name: Resize fal.ai source to host icon sizes
        env:
          SOURCE_IMAGE: https://v3b.fal.media/files/b/0aaef189/q7PyEGCd9DTwAl4vsirxx_f551fcbbfda34967a8443d9ed824dbc7.png
        run: |
          python - <<'PY'
          import os
          from io import BytesIO
          from pathlib import Path
          from urllib.request import urlopen
          from PIL import Image

          url = os.environ["SOURCE_IMAGE"]
          with urlopen(url, timeout=30) as response:
              data = response.read(8 * 1024 * 1024 + 1)
          if len(data) > 8 * 1024 * 1024:
              raise SystemExit("Icon source exceeds 8 MiB")
          im = Image.open(BytesIO(data)).convert("RGBA")
          if im.size != (1024, 1024):
              raise SystemExit(f"Unexpected source dimensions: {im.size}")
          if im.getchannel("A").getextrema()[0] > 5:
              raise SystemExit("Fal cutout must have transparent pixels outside the icon")

          source = Path("scripts/assets/tool-icons/curl-generator.png")
          source.parent.mkdir(parents=True, exist_ok=True)
          full = im.resize((512, 512), Image.Resampling.LANCZOS)
          full.save(source, format="PNG", optimize=True, compress_level=9)

          thumb = Path("static/icons/tools/curl-generator.webp")
          thumb.parent.mkdir(parents=True, exist_ok=True)
          small = im.resize((160, 160), Image.Resampling.LANCZOS)
          for quality in (80, 74, 68, 62, 55, 45):
              small.save(thumb, format="WEBP", quality=quality, method=6)
              if thumb.stat().st_size <= 12_000:
                  break
          if thumb.stat().st_size > 12_000:
              raise SystemExit(f"Catalog icon exceeds 12 kB: {thumb.stat().st_size}")
          print("PNG", source.stat().st_size, "WEBP", thumb.stat().st_size)
          PY
      - name: Commit generated icons to registration branch
        run: |
          git config user.name "ygrip"
          git config user.email "yunaz.gilang@gmail.com"
          git add scripts/assets/tool-icons/curl-generator.png static/icons/tools/curl-generator.webp
          if ! git diff --cached --quiet; then
            git commit -m "feat(icons): add fal.ai-generated cURL Studio clay icon"
            git push
          fi
