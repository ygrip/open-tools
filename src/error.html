<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="light dark">
  <title>%sveltekit.status% · A little pause · Open Tools</title>
  <style>
    :root { font-family: ui-rounded, 'Avenir Next', system-ui, sans-serif; color: #382f2b; background: #f6f1e9; --surface:#fffcf6; --line:#e7dcd0; --muted:#71645c; --shadow:rgba(91,66,43,.1); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; }
    main { display:grid; grid-template-columns:1fr 1fr; width:min(960px,100%); overflow:hidden; border:1px solid var(--line); border-radius:32px; background:var(--surface); box-shadow:0 8px 0 -3px var(--line),0 20px 50px -20px var(--shadow),inset 2px 3px 2px rgba(255,255,255,.3); }
    .copy { padding:clamp(26px,5vw,48px); align-self:center; }
    .brand { font-weight:900; font-size:20px; letter-spacing:-.04em; margin:0 0 35px; }
    .code { display:inline-block; padding:8px 13px; border-radius:100px; background:#f9ddcb; color:#382f2b; font-size:12px; font-weight:800; }
    h1 { font-size:clamp(32px,5vw,46px); line-height:1.1; letter-spacing:-.05em; margin:20px 0; text-wrap:balance; }
    p { font-size:15px; line-height:1.8; color:var(--muted); }
    nav { display:flex; flex-wrap:wrap; gap:14px; margin-top:28px; }
    a { display:inline-flex; min-height:48px; align-items:center; justify-content:center; padding:12px 18px; color:inherit; border:1px solid var(--line); border-radius:17px; text-decoration:none; font-size:13px; font-weight:850; box-shadow:0 4px 0 var(--line); }
    a.primary { background:#ef946b; color:#38251d; border-color:#d47e59; box-shadow:0 4px 0 #d47e59,inset 1px 2px 2px rgba(255,255,255,.4); }
    a:focus-visible { outline:3px solid #ad4527; outline-offset:5px; }
    .art { display:grid; place-items:center; background:#fae5c6; padding:24px; }
    svg { width:100%; max-width:400px; height:auto; }
    .note { font-size:12px; margin-top:24px; }
    @media (prefers-color-scheme:dark) { :root { color:#f6eee6; background:#211f25; --surface:#2d2a31; --line:#48404a; --muted:#c4b7ad; --shadow:rgba(0,0,0,.3); } a:focus-visible { outline-color:#ffc2a1; } }
    @media (max-width:640px) { main { grid-template-columns:1fr; } .art { padding:15px; } svg { max-width:300px; } .brand { margin-bottom:24px; } }
  </style>
</head>
<body>
  <main>
    <section class="copy">
      <p class="brand">opentools</p>
      <span class="code">Error %sveltekit.status%</span>
      <h1>A little pause. We’ll get there.</h1>
      <p>This page couldn’t get ready right now. Try once more, or head back to the toolbox for your next little helper.</p>
      <nav aria-label="Error recovery"><a class="primary" href="">Try again</a><a href="/">Back to the toolbox</a></nav>
      <p class="note">This fallback works without JavaScript, fonts, or image downloads.</p>
    </section>
    <div class="art">
      <svg viewBox="0 0 400 400" role="img" aria-labelledby="art-title">
        <title id="art-title">A smiling orange clay toolbox taking a small repair break.</title>
        <defs><linearGradient id="clay" x2=".8" y2="1"><stop stop-color="#ffc497"/><stop offset="1" stop-color="#ee8856"/></linearGradient><linearGradient id="mint" x2="1" y2="1"><stop stop-color="#d8ecd7"/><stop offset="1" stop-color="#a4cbb3"/></linearGradient></defs>
        <ellipse cx="204" cy="324" rx="130" ry="17" fill="#dfbd92" opacity=".45"/>
        <path d="M141 145v-26c0-46 92-46 92 0v26" fill="none" stroke="#dc8c58" stroke-width="21" stroke-linecap="round"/>
        <path d="M141 140v-24c0-42 92-42 92 0v24" fill="none" stroke="#ffb57e" stroke-width="16" stroke-linecap="round"/>
        <rect x="83" y="140" width="212" height="177" rx="48" fill="#d78050"/>
        <rect x="80" y="131" width="212" height="177" rx="48" fill="url(#clay)"/>
        <path d="M105 160c19-15 111-16 151-6" fill="none" stroke="#ffd6b5" stroke-width="8" stroke-linecap="round" opacity=".7"/>
        <ellipse cx="150" cy="213" rx="8" ry="11" fill="#49352d"/><ellipse cx="218" cy="213" rx="8" ry="11" fill="#49352d"/>
        <ellipse cx="134" cy="235" rx="14" ry="8" fill="#ed8e82"/><ellipse cx="235" cy="235" rx="14" ry="8" fill="#ed8e82"/>
        <path d="M172 238q13 15 26 0" fill="none" stroke="#82503a" stroke-width="5" stroke-linecap="round"/>
        <g transform="rotate(-12 183 272)"><rect x="153" y="260" width="61" height="25" rx="9" fill="#fff0cb"/><path d="m172 261 10 23m8-24 10 22" stroke="#e3cea9" stroke-width="3"/></g>
        <path d="m287 225 22-8 15 11-1 20 17 12-5 25-21 5-4 20-25 7-17-15-20 7-18-19 4-21-16-16 8-24 22-1 9-18 23-1Z" fill="url(#mint)" stroke="#9fc5ac" stroke-width="3"/>
        <circle cx="284" cy="265" r="22" fill="#fae5c6" stroke="#92bda1" stroke-width="6"/>
        <g transform="rotate(27 109 313)"><rect x="76" y="304" width="81" height="15" rx="7" fill="#bdb0d5"/><path d="M71 300v24l-15 7-12-9v-19l12 8 15-11Z" fill="#dcd2ed" stroke="#b8a7cf" stroke-width="2"/></g>
        <path d="m308 106 4 12 12 4-12 4-4 12-4-12-12-4 12-4 4-12Z" fill="#f2bf64"/>
        <circle cx="92" cy="115" r="7" fill="#c9b5e1"/>
      </svg>
    </div>
  </main>
</body>
</html>
